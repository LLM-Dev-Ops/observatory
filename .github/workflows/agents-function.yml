name: Agents Function

on:
  pull_request:
    branches: [main]
    paths:
      - functions/**
      - package.json
      - package-lock.json
      - .github/workflows/agents-function.yml
  push:
    branches: [main]
    paths:
      - functions/**
      - package.json
      - package-lock.json
      - .github/workflows/agents-function.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run function regression tests
        run: npm test
